version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dart_odbc: ^6.2.0
  excel: ^4.0.6
  file_picker: ^8.1.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
